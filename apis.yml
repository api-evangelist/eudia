aid: eudia
name: Eudia
description: >-
  Eudia is an enterprise augmented-intelligence platform for in-house legal,
  compliance, and procurement teams at large organizations and government
  agencies. Its "Enterprise Brain" ingests a company's contracts, policies,
  precedents, and prior decisions and codifies the judgment of its legal experts
  into governed AI workflows, while "Expert Digital Twins" let business teams
  self-serve governed legal guidance without direct attorney involvement.
  Products span compliance automation, contracting, decision self-service,
  mergers and acquisitions, and litigation support, with connectors into
  Microsoft, Google Drive, SharePoint, Box, Salesforce, DocuSign, OnIt, and
  LinkSquares. Founded in 2023 and headquartered in Palo Alto, California,
  Eudia raised a Series A of up to $105M led by General Catalyst with Sierra
  Ventures, Floodgate, and Defy Partners. It does not currently publish a public
  developer API; this profile tracks its identity, trust, and security posture.
